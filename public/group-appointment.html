<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Group Appointment - Passport Tracking System</title>
    <!-- FontAwesome & Google Plus Jakarta Sans Font -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --primary-light: #e0e7ff;
            --bg-main: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --radius-sm: 8px;
            --radius-md: 12px;
            --shadow-subtle: 0 4px 6px -1px rgba(0, 0, 0, 0.02), 0 2px 4px -1px rgba(0, 0, 0, 0.02);
            --shadow-elevated: 0 10px 15px -3px rgba(0, 0, 0, 0.05), 0 4px 6px -2px rgba(0, 0, 0, 0.025);
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            display: flex;
            min-height: 100vh;
            overflow-x: hidden;
        }
        /* Sidebar */
        .sidebar {
            width: 260px;
            background-color: var(--card-bg);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 24px 0;
        }
        .sidebar-top {
            display: flex;
            flex-direction: column;
        }
        .user-profile-mini {
            display: flex;
            align-items: center;
            padding: 0 24px 20px;
            border-bottom: 1px solid #f1f5f9;
            margin-bottom: 16px;
        }
        .user-profile-mini i {
            font-size: 38px;
            color: var(--primary);
            margin-right: 12px;
        }
        .user-info .name {
            font-weight: 700;
            font-size: 14px;
            color: var(--text-main);
            overflow-wrap: anywhere;
        }
        .nav-links {
            list-style: none;
        }
        .nav-links li a {
            display: flex;
            align-items: center;
            padding: 12px 24px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s ease;
        }
        .nav-links li.active a, .nav-links li a:hover {
            background-color: var(--primary-light);
            color: var(--primary);
            border-right: 4px solid var(--primary);
            font-weight: 600;
        }
        .nav-links li a i {
            margin-right: 12px;
            font-size: 16px;
        }
        .sidebar-bottom {
            padding: 0 24px;
        }
        .sidebar-bottom a {
            display: flex;
            align-items: center;
            padding: 10px 0;
            color: #ef4444;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
        }
        .sidebar-bottom a i {
            margin-right: 12px;
        }
        /* Main Content */
        .main-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }
        .header {
            background-color: var(--card-bg);
            padding: 22px 36px;
            border-bottom: 1px solid var(--border-color);
            font-size: 18px;
            font-weight: 700;
            color: var(--text-main);
            letter-spacing: -0.3px;
        }
        .dashboard-container {
            padding: 35px 40px;
            max-width: 1000px;
            margin: 0 auto;
            width: 100%;
        }
        .form-section-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 30px;
            box-shadow: var(--shadow-subtle);
            margin-bottom: 20px;
        }
        .section-title {
            font-size: 17px;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .section-subtitle {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 24px;
        }
        .form-group {
            display: flex;
            flex-direction: column;
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            font-weight: 600;
            font-size: 13px;
            color: #334155;
            margin-bottom: 8px;
        }
        .form-control {
            width: 100%;
            padding: 11px 14px;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            font-size: 14px;
            font-family: inherit;
            color: var(--text-main);
            background-color: #fff;
            outline: none;
            transition: all 0.2s ease;
        }
        .form-control:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1);
        }
        .action-buttons {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 12px;
            margin-top: 30px;
        }
        .btn-primary, .btn-secondary {
            padding: 11px 24px;
            font-size: 14px;
            font-weight: 600;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-family: inherit;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            border: none;
            transition: all 0.2s ease;
        }
        .btn-primary {
            background-color: var(--primary);
            color: #fff;
            box-shadow: 0 2px 4px rgba(79, 70, 229, 0.2);
        }
        .btn-primary:hover {
            background-color: var(--primary-hover);
            transform: translateY(-1px);
        }
        .btn-secondary {
            background-color: #f1f5f9;
            color: #475569;
            border: 1px solid var(--border-color);
        }
        .btn-secondary:hover {
            background-color: #e2e8f0;
        }
    </style>
</head>
<body>
    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="sidebar-top">
            <div class="user-profile-mini">
                <i class="fa-solid fa-circle-user"></i>
                <div class="user-info"><div class="name" id="user-name">Loading...</div></div>
            </div>
            <ul class="nav-links">
                <li><a href="dashboard.html"><i class="fa-solid fa-house"></i> Dashboard</a></li>
                <li><a href="payments.html"><i class="fa-solid fa-wallet"></i> Payments</a></li>
                <li><a href="receipts.html"><i class="fa-solid fa-receipt"></i> Receipts</a></li>
                <li><a href="enquiries.html"><i class="fa-solid fa-circle-question"></i> Enquiries</a></li>
                <li><a href="settings.html"><i class="fa-solid fa-gear"></i> Settings</a></li>
            </ul>
        </div>
        <div class="sidebar-bottom">
            <a href="index.html"><i class="fa-solid fa-right-from-bracket"></i> Log Out</a>
        </div>
    </aside>

    <!-- Main Content Area -->
    <div class="main-container">
        <div class="header">GROUP APPOINTMENT</div>
        <div class="dashboard-container">
            <div class="form-section-card">
                <div class="section-title"><i class="fa-solid fa-users" style="color:var(--primary);"></i> Number of Applicants</div>
                <div class="section-subtitle">Fields with asterisks (*) are required. Please specify how many applicants are joining this group booking.</div>
               
                <form id="groupSetupForm">
                    <div class="form-group">
                        <label for="numApplicants">Number of Applicants *</label>
                        <select id="numApplicants" class="form-control" required>
                            <option value="" disabled selected>- SELECT NUMBER OF APPLICANTS -</option>
                            <option value="2">2 Applicants</option>
                            <option value="3">3 Applicants</option>
                            <option value="4">4 Applicants</option>
                            <option value="5">5 Applicants</option>
                        </select>
                    </div>
                    <div class="action-buttons">
                        <a href="new-passport.html" class="btn-secondary"><i class="fa-solid fa-arrow-left"></i> Back</a>
                        <button type="submit" class="btn-primary">Next <i class="fa-solid fa-arrow-right"></i></button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        async function loadUserData() {
            try {
                const response = await fetch('../api/user-data.php');
                const data = await response.json();
                if (data.loggedIn && data.fullName) {
                    document.getElementById('user-name').textContent = data.fullName;
                    if (data.email) localStorage.setItem('userEmail', data.email);
                }
            } catch (error) {
                console.error('Unable to load user data:', error);
            }
        }
        document.addEventListener('DOMContentLoaded', loadUserData);

        document.getElementById('groupSetupForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const count = document.getElementById('numApplicants').value;
            if (!count) return alert('Please select the number of applicants.');
            localStorage.setItem('groupCount', count);
            window.location.href = `group-wizard.html?step=1&count=${count}`;
        });
    </script>
</body>
</html>
