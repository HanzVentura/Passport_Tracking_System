<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Group Appointment - Passport Tracking</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #f4f7f6; color: #333; display: flex; min-height: 100vh; overflow-x: hidden; }
        .sidebar { width: 260px; flex: 0 0 260px; background: #fff; border-right: 1px solid #e0e0e0; display: flex; flex-direction: column; justify-content: space-between; padding: 20px 0; }
        .user-profile-mini { display: flex; align-items: center; padding: 0 20px 20px; border-bottom: 1px solid #eee; margin-bottom: 20px; }
        .user-profile-mini i { font-size: 36px; color: #3b82f6; margin-right: 12px; }
        .user-info .name { font-weight: 600; font-size: 14px; color: #1f2937; overflow-wrap: anywhere; }
        .nav-links { list-style: none; }
        .nav-links li a { display: flex; align-items: center; padding: 12px 20px; color: #4b5563; text-decoration: none; font-size: 14px; transition: all .2s ease; }
        .nav-links li.active a, .nav-links li a:hover { background: #eff6ff; color: #3b82f6; border-right: 4px solid #3b82f6; }
        .nav-links li a i { width: 16px; margin-right: 12px; text-align: center; }
        .sidebar-bottom { padding: 0 20px; }
        .sidebar-bottom a { display: flex; align-items: center; padding: 10px 0; color: #ef4444; text-decoration: none; font-size: 14px; font-weight: 500; }
        .sidebar-bottom a i { margin-right: 12px; }
        .main-content { flex: 1; min-width: 0; display: flex; flex-direction: column; overflow-y: auto; }
        .header { background: #fff; padding: 20px 30px; border-bottom: 1px solid #e0e0e0; font-size: 20px; font-weight: 700; color: #1f2937; }
        .dashboard-container { padding: 30px; max-width: 1400px; margin: 0 auto; width: 100%; }
        .card { background: #fff; border: 1px solid #e5e7eb; border-radius: 12px; padding: 24px; box-shadow: 0 2px 4px rgba(0,0,0,.02); }
        .form-group { display: flex; flex-direction: column; margin-bottom: 16px; }
        .form-group label { color: #374151; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
        .form-control { width: 100%; padding: 10px 12px; border: 1px solid #d1d5db; border-radius: 8px; outline: none; background: #fff; color: #1f2937; font-size: 14px; }
        .form-control:focus { border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59,130,246,.1); }
        .button-row { display: flex; justify-content: flex-end; align-items: center; gap: 16px; margin-top: 24px; }
        .btn-primary, .btn-secondary { border-radius: 8px; padding: 11px 24px; font-size: 14px; font-weight: 600; cursor: pointer; text-decoration: none; }
        .btn-primary { background: #3b82f6; color: #fff; border: 0; }
        .btn-primary:hover { background: #2563eb; }
        .btn-secondary { background: #fff; color: #374151; border: 1px solid #d1d5db; }
        .btn-secondary:hover { background: #f3f4f6; }
    </style>
</head>
<body>
    <aside class="sidebar">
        <div>
            <div class="user-profile-mini">
                <i class="fa-solid fa-circle-user"></i>
                <div class="user-info"><div class="name" id="user-name">Loading...</div></div>
            </div>
            <ul class="nav-links">
                <li><a href="dashboard.html"><i class="fa-solid fa-house"></i>Dashboard</a></li>
                <li><a href="payments.html"><i class="fa-solid fa-wallet"></i>Payments</a></li>
                <li><a href="receipts.html"><i class="fa-solid fa-receipt"></i>Receipts</a></li>
                <li><a href="enquiries.html"><i class="fa-solid fa-circle-question"></i>Enquiries</a></li>
                <li><a href="settings.html"><i class="fa-solid fa-gear"></i>Settings</a></li>
            </ul>
        </div>
        <div class="sidebar-bottom"><a href="index.html"><i class="fa-solid fa-right-from-bracket"></i>Log Out</a></div>
    </aside>

    <main class="main-content">
        <div class="header">GROUP APPOINTMENT</div>
        <div class="dashboard-container">
            <div class="card">
                <h2 style="font-size: 18px; margin-bottom: 6px; color: #1f2937;">Number of Applicants</h2>
                <p style="color: #6b7280; font-size: 13px; margin-bottom: 20px;">Fields with asterisks (*) are required.</p>
                
                <form id="groupSetupForm">
                    <div class="form-group">
                        <label for="numApplicants">Number of Applicants *</label>
                        <select id="numApplicants" class="form-control" required>
                            <option value="" disabled selected>NUMBER OF APPLICANTS</option>
                            <option value="2">2 Applicants</option>
                            <option value="3">3 Applicants</option>
                            <option value="4">4 Applicants</option>
                            <option value="5">5 Applicants</option>
                        </select>
                    </div>
                    <div class="button-row">
                        <a href="dashboard.html" class="btn-secondary">Back</a>
                        <button type="submit" class="btn-primary">Next</button>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
    <script>
        document.getElementById('groupSetupForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const count = document.getElementById('numApplicants').value;
            if (!count) return alert('Please select the number of applicants.');
            localStorage.setItem('groupCount', count);
            window.location.href = `group-wizard.html?step=1&count=${count}`;
        });
    </script>
</body>
</html>
